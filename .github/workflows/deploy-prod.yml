# Manual only: validate custom_addons on a throwaway DB, then deploy.
# Merge / push to main does NOT deploy — run this workflow explicitly.
#
# Production layout: /root/reware (no git clone). Secrets:
#   PROD_SSH_HOST, PROD_SSH_USER, PROD_SSH_KEY, PROD_APP_DIR (/root/reware)
#
# Guardrails:
#   * no push/PR triggers (merge ≠ deploy)
#   * confirm_deploy must be DEPLOY
#   * validate job must pass before any production upload / odoo -u
#   * shares concurrency group prod-deploy with shell/repair (no parallel prod jobs)
#   * cancel-in-progress: false — never kill an in-flight odoo -u
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to run production upload + module upgrade
        required: true
        default: ""
        type: string

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Guard DEPLOY confirmation
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]]; then
            echo "::error::confirm_deploy must be exactly DEPLOY (got: '${{ github.event.inputs.confirm_deploy }}')."
            echo "Merge to main does not deploy. Re-run this workflow and type DEPLOY only when ready."
            exit 1
          fi
          echo "DEPLOY confirmed."

      - uses: actions/checkout@v4

      - name: Normalize shell scripts (CRLF -> LF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dos2unix
          dos2unix scripts/*.sh

      - name: Validate + install all custom_addons on throwaway DB
        run: bash scripts/validate-custom-addons.sh

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload custom_addons
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "quote-manage-system/custom_addons/*"
          target: "${{ secrets.PROD_APP_DIR }}/custom_addons"
          # strip "quote-manage-system/custom_addons/" so files land directly
          # under <APP_DIR>/custom_addons/<module> (Odoo's mounted addons path),
          # not in a nested quote-manage-system/custom_addons/ subtree.
          strip_components: 2
          overwrite: true

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "scripts/deploy-reware-remote.sh,scripts/sync_rw_templates.py"
          target: "/tmp"

      - name: Upgrade module on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            chmod +x /tmp/scripts/deploy-reware-remote.sh
            APP_DIR="${{ secrets.PROD_APP_DIR }}" SYNC_SCRIPT=/tmp/scripts/sync_rw_templates.py \
              /tmp/scripts/deploy-reware-remote.sh
